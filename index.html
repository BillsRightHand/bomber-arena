<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="轟炸超人">
<meta name="theme-color" content="#f4ecd8">
<!-- 加入主畫面後從圖示打開：全螢幕、橫向、沒有瀏覽器外框（iPhone 的 Safari 不能用按鈕全螢幕，只能這樣） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>BomberArena</title>
<style>
  /* 方舟小遊戲：整頁就是遊戲畫面；載入中是方舟的米色紙＋墨色進度條（跟方舟 WebView 的底色 #f4ecd8 一樣，打開不會閃白） */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4ecd8;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #9fbcd6; outline: none; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #f4ecd8; color: #3a3128; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; transition: opacity .35s; }
  #loader .t { font-size: 24px; font-weight: 700; letter-spacing: .12em; }
  #loader .s { font-size: 14px; color: #7a6a58; margin-top: 8px; }
  #bar { width: min(60vw, 320px); height: 10px; border-radius: 99px; background: #e6d3ab; overflow: hidden; margin-top: 22px; }
  #fill { height: 100%; width: 0; background: #3a3128; border-radius: 99px; transition: width .2s; }
  #err { display: none; max-width: 80vw; margin-top: 16px; font-size: 13px; color: #c2382e; text-align: center; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loader">
  <div class="t">轟炸超人</div>
  <div class="s">方舟小遊戲・載入中</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="err"></div>
</div>
<script>window.BOMBER_CDN="https://cdn.jsdelivr.net/gh/BillsRightHand/bomber-arena@ca922ae9ba3dbda7f3487803ae59195c05276fe4/Build";</script>
<script src="bombernet.js"></script>
<script>
  var canvas = document.querySelector("#unity-canvas");
  var loader = document.querySelector("#loader");
  var fill = document.querySelector("#fill");
  var err = document.querySelector("#err");
  // 大檔（wasm、data）可以從 CDN 拿：發佈腳本（Tools/publish_pages.sh）會塞 window.BOMBER_CDN（jsDelivr，釘在某個 commit）。
  // GitHub Pages 在台灣常常很慢；CDN 失敗就加 nocdn=1 重新整理，改從同一個網站拿。
  var noCdn = /[?&]nocdn=1/.test(location.search);
  var buildUrl = (!noCdn && window.BOMBER_CDN) || "Build";
  function fallback(why) {
    if (buildUrl === "Build") return false;
    location.replace(location.href + (location.search ? "&" : "?") + "nocdn=1");
    return true;
  }
  var config = {
    arguments: [],
    dataUrl: buildUrl + "/WebGL.data.unityweb",
    frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
    codeUrl: buildUrl + "/WebGL.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Ciro",
    productName: "BomberArena",
    productVersion: "0.2.0",
    // 手機像素密度最多 2 倍：3 倍螢幕全解析度太吃效能、會發熱
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    showBanner: function (msg, type) { if (type === "error") { err.style.display = "block"; err.textContent = msg; } },
  };
  var script = document.createElement("script");
  script.src = buildUrl + "/WebGL.loader.js";
  script.onerror = function () { if (!fallback()) { err.style.display = "block"; err.textContent = "載入失敗，請重新整理"; } };
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) { fill.style.width = Math.round(p * 100) + "%"; })
      .then(function (instance) {
        window.unityInstance = instance;
        loader.style.opacity = "0";
        setTimeout(function () { loader.remove(); }, 400);
        canvas.focus();
      })
      .catch(function (m) { if (!fallback()) { err.style.display = "block"; err.textContent = "載入失敗：" + m; } });
  };
  document.body.appendChild(script);
  // 嵌在 iframe 裡（方舟網頁版、multi.html）時，第一下點擊只會拿到焦點、按鈕沒反應：按下去就先把焦點給遊戲畫布
  window.addEventListener("pointerdown", function () { if (document.activeElement !== canvas) { window.focus(); canvas.focus(); } }, true);
  // 全螢幕（遊戲裡的「全螢幕」鈕）：瀏覽器只准在使用者按下／放開的那一刻全螢幕，
  // 所以 Unity 按下去時只記一筆（BomberFS.request），等手指放開（pointerup／touchend，仍算使用者動作）才真的進全螢幕＋鎖橫向。
  window.BomberFS = {
    pending: false,
    // 嵌在 App 裡（方舟的 WebView、LINE／FB 的內建瀏覽器）或 iframe 裡：本來就沒有網址列、或全螢幕／加入主畫面都做不到 → 不出鈕
    embedded: function () {
      var ua = navigator.userAgent;
      if (/; wv\)| Line\/|FBAN|FBAV|Instagram/.test(ua)) return true;
      if (/iPhone|iPod/.test(ua) && !/Safari/.test(ua)) return true; // iOS 的 WKWebView 沒有 Safari 字樣
      try { return window.top !== window; } catch (e) { return true; }
    },
    supported: function () { return !this.embedded() && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
    active: function () { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
    // iPhone 的 Safari 不給網頁全螢幕；從主畫面圖示打開（standalone）本來就沒有外框
    ios: function () { return !this.embedded() && /iPhone|iPod/.test(navigator.userAgent); },
    standalone: function () { return (window.matchMedia && matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches) || navigator.standalone === true; },
    request: function () { this.pending = true; },
    enter: function () {
      var el = document.documentElement;
      var go = el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) : el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null;
      Promise.resolve(go).then(function () { if (screen.orientation && screen.orientation.lock) return screen.orientation.lock("landscape"); }).catch(function () {});
    },
  };
  var fsGesture = function () { if (window.BomberFS.pending) { window.BomberFS.pending = false; window.BomberFS.enter(); } };
  document.addEventListener("pointerup", fsGesture, true);
  document.addEventListener("touchend", fsGesture, true);
  document.addEventListener("click", fsGesture, true);
</script>
</body>
</html>
